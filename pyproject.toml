[project]
name = "mia-bridge"
version = "0.1.0"
description = "iMessage bridge that puts Mia in the family group chat"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4",
    "msal>=1.31",
    "httpx>=0.27",
    "flask>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mia-bridge = "mia_bridge.__main__:main"

[tool.setuptools]
packages = ["mia_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long prompt and template strings; enforced by review, not lint
    "E731",  # small lambdas are used deliberately
]
