[project]
name = "kinchat"
version = "0.1.0"
description = "A Claude-powered assistant for your family's iMessage group chat"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4",
    "msal>=1.31",
    "httpx>=0.27",
    "flask>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
kinchat = "kinchat.__main__:main"

[tool.setuptools]
packages = ["kinchat", "kinchat.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long prompt and template strings; enforced by review, not lint
    "E731",  # small lambdas are used deliberately
]
